<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>リアル八節くん ─ 動画比較</title>
  <meta name="description" content="弓道の稽古動画を2本並べて同期再生・スロー再生・コマ送りで比較し、フォームの違いをチェックできます。" />
  <meta name="keywords" content="弓道, 射法八節, 動画比較, フォームチェック, スロー再生, UNIQLO UI" />

  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <script src="sync.js"></script>
  <script src="tutorial.js"></script>
  <meta name="theme-color" content="#ffffff">
<!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
<!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-icon.png">
  <meta name="msapplication-TileImage" content="ms-icon-144x144.png">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    /* ================================================================
       UNIQLO STYLE DESIGN SYSTEM & TOKENS (動画比較版)
       ================================================================ */
    :root {
      --uq-red: #E60012;
      --uq-red-hover: #CC0010;
      --uq-red-light: #FFF0F0;
      --uq-black: #111111;
      --uq-dark-gray: #333333;
      --uq-gray: #666666;
      --uq-light-gray: #999999;
      --uq-border: #E5E5E5;
      --uq-border-light: #F0F0F0;
      --uq-bg: #FFFFFF;
      --uq-surface: #F8F8F8;
      --uq-surface-subtle: #FAFAFA;
      
      --primary: var(--uq-red);
      --text: var(--uq-black);
      --text-sub: var(--uq-gray);
      --text-muted: var(--uq-light-gray);
      --line: var(--uq-border);
      --line-subtle: var(--uq-border-light);
      --bg: var(--uq-bg);
      --panel: var(--uq-surface);

      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 6px;
      --radius-pill: 9999px;

      --font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-scale: 1;

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
    }

    [data-theme="dark"] {
      --uq-black: #F5F5F5;
      --uq-dark-gray: #E0E0E0;
      --uq-gray: #A0A0A0;
      --uq-light-gray: #666666;
      --uq-border: #2A2A2A;
      --uq-border-light: #222222;
      --uq-bg: #121212;
      --uq-surface: #1C1C1C;
      --uq-surface-subtle: #181818;
      --uq-red-light: rgba(230, 0, 18, 0.15);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.6);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.8);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      font-size: calc(14px * var(--font-scale));
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      color: inherit;
      transition: all 0.15s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
      display: inline-block;
      vertical-align: middle;
    }

    /* HEADER */
    .uq-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 52px;
      flex-shrink: 0;
    }

    .uq-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .uq-logo-box {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
    }

    .uq-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .uq-app-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .uq-app-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .uq-tag-badge {
      background: var(--uq-black);
      color: #FFFFFF;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: var(--radius-sm);
    }

    [data-theme="dark"] .uq-tag-badge {
      background: var(--uq-red);
    }

    .uq-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .uq-icon-btn {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--text);
    }

    .uq-icon-btn:hover {
      background: var(--panel);
    }

    /* MAIN CONTAINER */
    .uq-main-container {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .uq-section-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
    }

    /* COMPARE AREA */
    .uq-compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .uq-compare-grid.vertical {
      grid-template-columns: 1fr;
    }

    .uq-slot-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .uq-slot-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .uq-slot-badge {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-sm);
      background: var(--uq-red);
      color: #FFFFFF;
      font-weight: 900;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .uq-slot-select {
      flex: 1;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      outline: none;
    }

    .uq-video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .uq-video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Controls Bar */
    .uq-compare-hud {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .uq-timeline-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .uq-time-label {
      font-family: 'Inter', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      min-width: 36px;
      text-align: center;
    }

    .uq-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--line);
      outline: none;
      cursor: pointer;
    }

    .uq-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 2px;
      background: var(--uq-red);
      cursor: pointer;
    }

    .uq-hud-btns {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .uq-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .uq-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
    }

    .uq-btn:hover {
      background: var(--panel);
      border-color: var(--uq-gray);
    }

    .uq-btn.primary {
      background: var(--uq-red) !important;
      color: #FFFFFF !important;
      border-color: var(--uq-red) !important;
    }

    .uq-btn.primary:hover {
      background: var(--uq-red-hover) !important;
    }

    .uq-btn.active-red {
      background: var(--uq-red) !important;
      color: #FFFFFF !important;
      border-color: var(--uq-red) !important;
    }

    .uq-btn.danger {
      color: var(--uq-red);
      background: var(--uq-red-light);
      border-color: rgba(230,0,18,0.2);
    }

    /* Video Library */
    .uq-library-item {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .uq-lib-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .uq-lib-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }

    .uq-lib-meta {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'Inter', monospace;
    }

    .uq-lib-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text-sub);
      width: fit-content;
      margin-top: 2px;
    }

    .uq-lib-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Modal */
    .uq-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .uq-modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .uq-modal-card {
      background: var(--bg);
      width: 100%;
      max-width: 420px;
      border-radius: var(--radius-md);
      padding: 24px;
      position: relative;
      box-shadow: var(--shadow-lg);
    }

    .uq-input-text {
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .uq-empty-box {
      border: 2px dashed var(--line);
      border-radius: var(--radius-md);
      padding: 32px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      background: var(--panel);
    }

    /* DRAWER */
    .uq-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .uq-drawer-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .uq-drawer {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: var(--bg);
      z-index: 2001;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .uq-drawer.open {
      right: 0;
    }

    .uq-drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .uq-drawer-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--text);
    }

    .uq-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
    }

    .uq-drawer-section-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 12px 20px 6px;
    }

    .uq-drawer-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      transition: background 0.15s;
    }

    .uq-drawer-link:hover {
      background: var(--panel);
    }

    .uq-drawer-link.active {
      color: var(--uq-red);
      background: var(--uq-red-light);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="uq-header">
    <div class="uq-brand">
      <div class="uq-logo-box"><img src="favicon-96x96.png" alt="リアル八節くん" width="30" height="30"></div>
      <div class="uq-app-title-wrap">
        <span class="uq-app-title">
          リアル八節くん
          <span class="uq-tag-badge">動画比較</span>
        </span>
      </div>
    </div>
    <div class="uq-header-actions">
      <button class="uq-icon-btn" id="themeToggleBtn" aria-label="テーマ切替" title="ダーク/ライト切替">
        <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
      </button>
      <button class="uq-icon-btn" id="menuToggleBtn" onclick="toggleDrawer()" aria-label="メニュー">
        <span class="material-symbols-outlined">menu</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="uq-main-container">
    <!-- SECTION 1: 比較プレイヤー -->
    <section>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 class="uq-section-title" style="margin-bottom:0; border:none; padding:0;">
          <span class="material-symbols-outlined" style="font-size:16px;">splitscreen</span>
          動画の比較再生
        </h2>
        <button class="uq-btn" id="layoutToggleBtn" style="padding:4px 8px; font-size:11px; width:auto;">
          <span class="material-symbols-outlined" style="font-size:15px;">view_column</span>
          左右 / 上下切替
        </button>
      </div>

      <div class="uq-compare-grid" id="compareGrid">
        <!-- Slot A -->
        <div class="uq-slot-card">
          <div class="uq-slot-header">
            <span class="uq-slot-badge">A</span>
            <select class="uq-slot-select" id="selectA"><option value="">動画を選択...</option></select>
          </div>
          <div class="uq-video-wrapper">
            <video id="videoA" playsinline></video>
          </div>
        </div>

        <!-- Slot B -->
        <div class="uq-slot-card">
          <div class="uq-slot-header">
            <span class="uq-slot-badge" style="background:var(--uq-black);">B</span>
            <select class="uq-slot-select" id="selectB"><option value="">動画を選択...</option></select>
          </div>
          <div class="uq-video-wrapper">
            <video id="videoB" playsinline></video>
          </div>
        </div>
      </div>

      <!-- Unified Controller HUD -->
      <div class="uq-compare-hud">
        <div class="uq-timeline-row">
          <span class="uq-time-label" id="seekCurrent">0:00</span>
          <input type="range" class="uq-slider" id="seekBar" min="0" max="0" step="0.01" value="0" disabled>
          <span class="uq-time-label" id="seekDuration">0:00</span>
        </div>

        <div class="uq-hud-btns">
          <div class="uq-btn-group">
            <button class="uq-btn primary" id="playPauseBtn" title="再生 / 一時停止">
              <span class="material-symbols-outlined" id="playIcon">play_arrow</span>
              <span id="playLabel">再生</span>
            </button>
            <button class="uq-btn" id="resetSyncBtn" title="先頭に戻す">
              <span class="material-symbols-outlined">replay</span>
            </button>
            <button class="uq-btn" id="frameBackBtn" title="1コマ戻す">
              <span class="material-symbols-outlined">skip_previous</span>
            </button>
            <button class="uq-btn" id="frameFwdBtn" title="1コマ進める">
              <span class="material-symbols-outlined">skip_next</span>
            </button>
          </div>

          <div class="uq-btn-group">
            <select class="uq-slot-select" id="speedSelect" style="width:auto; padding:5px 8px;">
              <option value="0.1">0.1x (超スロー)</option>
              <option value="0.25">0.25x</option>
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1" selected>1.0x (標準)</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- SECTION 2: 動画ライブラリ -->
    <section>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 class="uq-section-title" style="margin-bottom:0; border:none; padding:0;">
          <span class="material-symbols-outlined" style="font-size:16px;">video_library</span>
          保存済み動画ライブラリ
        </h2>
        <button class="uq-btn primary" id="addVideoBtn" style="padding:5px 10px; font-size:11.5px; width:auto;">
          ＋ 動画を追加
        </button>
      </div>

      <input type="file" id="fileInput" accept="video/*" style="display:none;">
      <div id="library-root"></div>
    </section>
  </main>

  <!-- ADD VIDEO MODAL -->
  <div class="uq-modal-overlay" id="addModalOverlay">
    <div class="uq-modal-card">
      <h3 style="font-size:16px; font-weight:900; margin-bottom:14px;">📹 動画情報の入力</h3>
      
      <div style="margin-bottom:12px;">
        <label style="font-size:11px; font-weight:800; color:var(--text-sub); display:block; margin-bottom:4px;">タイトル</label>
        <input type="text" id="mTitle" class="uq-input-text" placeholder="例：会の伸び合いチェック">
      </div>

      <div style="margin-bottom:12px;">
        <label style="font-size:11px; font-weight:800; color:var(--text-sub); display:block; margin-bottom:4px;">撮影日</label>
        <input type="date" id="mDate" class="uq-input-text">
      </div>

      <div style="margin-bottom:16px;">
        <label style="font-size:11px; font-weight:800; color:var(--text-sub); display:block; margin-bottom:4px;">タグ（任意）</label>
        <input type="text" id="mTag" class="uq-input-text" placeholder="例：離れのブレ">
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="uq-btn" id="mCancelBtn" style="width:auto;">キャンセル</button>
        <button class="uq-btn primary" id="mSaveBtn" style="width:auto;">保存する</button>
      </div>
    </div>
  </div>


  <!-- DRAWER (8 items) -->
  <div class="uq-drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
  <aside class="uq-drawer" id="sideDrawer">
    <div class="uq-drawer-header">
      <span class="uq-drawer-title">メニュー</span>
      <button class="uq-icon-btn" onclick="toggleDrawer()" aria-label="閉じる">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="uq-drawer-body">
      <div class="uq-drawer-section-label">PAGE SELECT</div>
      <a href="index.html" class="uq-drawer-link">
        <span class="material-symbols-outlined">accessibility_new</span>

        <span class="material-symbols-outlined">compare</span>
        <span>動画比較（フォームチェック）</span>

  <script>
    const DB_NAME = 'kyudo_video_db';
    const STORE_NAME = 'videos';
    const META_KEY = 'kyudo_video_meta_v1';

    function openVideoDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbPutVideo(id, blob) {
      const db = await openVideoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({ id, blob });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbGetVideo(id) {
      const db = await openVideoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(id);
        req.onsuccess = () => resolve(req.result ? req.result.blob : null);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbDeleteVideo(id) {
      const db = await openVideoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function loadMeta() {
      try {
        const raw = localStorage.getItem(META_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }

    function saveMeta(list) {
      localStorage.setItem(META_KEY, JSON.stringify(list));
    }

    const videoA = document.getElementById('videoA');
    const videoB = document.getElementById('videoB');
    const selectA = document.getElementById('selectA');
    const selectB = document.getElementById('selectB');
    const compareGrid = document.getElementById('compareGrid');
    let objectUrls = [];
    let pendingFile = null;

    function renderSelectOptions() {
      const meta = loadMeta();
      [selectA, selectB].forEach(sel => {
        const cur = sel.value;
        sel.innerHTML = '<option value="">動画を選択...</option>' +
          meta.map(m => `<option value="${m.id}">${m.title || '(無題)'}</option>`).join('');
        if (meta.some(m => String(m.id) === cur)) sel.value = cur;
      });
    }

    async function loadIntoSlot(videoEl, id) {
      if (!id) {
        videoEl.removeAttribute('src');
        videoEl.load();
        updateSeekRange();
        return;
      }
      const blob = await idbGetVideo(Number(id));
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      objectUrls.push(url);
      videoEl.src = url;
    }

    selectA.addEventListener('change', () => loadIntoSlot(videoA, selectA.value));
    selectB.addEventListener('change', () => loadIntoSlot(videoB, selectB.value));

    document.getElementById('layoutToggleBtn').addEventListener('click', () => {
      compareGrid.classList.toggle('vertical');
    });

    // Playback control
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const playLabel = document.getElementById('playLabel');
    let isPlaying = false;

    playPauseBtn.addEventListener('click', () => {
      if (isPlaying) {
        videoA.pause();
        videoB.pause();
        playIcon.textContent = 'play_arrow';
        playLabel.textContent = '再生';
        playPauseBtn.classList.remove('active-red');
      } else {
        if (videoA.src) videoA.play().catch(()=>{});
        if (videoB.src) videoB.play().catch(()=>{});
        playIcon.textContent = 'pause';
        playLabel.textContent = '停止';
        playPauseBtn.classList.add('active-red');
      }
      isPlaying = !isPlaying;
    });

    document.getElementById('resetSyncBtn').addEventListener('click', () => {
      videoA.currentTime = 0;
      videoB.currentTime = 0;
      updateSeekPositionDisplay();
    });

    const FRAME_STEP = 1 / 30;
    document.getElementById('frameBackBtn').addEventListener('click', () => {
      videoA.pause(); videoB.pause();
      isPlaying = false;
      playIcon.textContent = 'play_arrow';
      playLabel.textContent = '再生';
      if (videoA.src) videoA.currentTime = Math.max(0, videoA.currentTime - FRAME_STEP);
      if (videoB.src) videoB.currentTime = Math.max(0, videoB.currentTime - FRAME_STEP);
      updateSeekPositionDisplay();
    });

    document.getElementById('frameFwdBtn').addEventListener('click', () => {
      videoA.pause(); videoB.pause();
      isPlaying = false;
      playIcon.textContent = 'play_arrow';
      playLabel.textContent = '再生';
      if (videoA.src) videoA.currentTime += FRAME_STEP;
      if (videoB.src) videoB.currentTime += FRAME_STEP;
      updateSeekPositionDisplay();
    });

    document.getElementById('speedSelect').addEventListener('change', (e) => {
      const spd = parseFloat(e.target.value);
      videoA.playbackRate = spd;
      videoB.playbackRate = spd;
    });

    // Seek Bar
    const seekBar = document.getElementById('seekBar');
    const seekCurrent = document.getElementById('seekCurrent');
    const seekDuration = document.getElementById('seekDuration');

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function updateSeekRange() {
      const durA = (videoA.src && isFinite(videoA.duration)) ? videoA.duration : 0;
      const durB = (videoB.src && isFinite(videoB.duration)) ? videoB.duration : 0;
      const maxDur = Math.max(durA, durB);
      seekBar.max = maxDur || 0;
      seekBar.disabled = maxDur <= 0;
      seekDuration.textContent = formatTime(maxDur);
      updateSeekPositionDisplay();
    }

    function updateSeekPositionDisplay() {
      const times = [];
      if (videoA.src) times.push(videoA.currentTime);
      if (videoB.src) times.push(videoB.currentTime);
      if (!times.length) {
        seekBar.value = 0;
        seekCurrent.textContent = '0:00';
        return;
      }
      const t = Math.max(...times);
      seekBar.value = t;
      seekCurrent.textContent = formatTime(t);
    }

    [videoA, videoB].forEach(v => {
      v.addEventListener('loadedmetadata', updateSeekRange);
      v.addEventListener('timeupdate', updateSeekPositionDisplay);
      v.addEventListener('ended', updateSeekPositionDisplay);
    });

    seekBar.addEventListener('input', (e) => {
      const t = parseFloat(e.target.value);
      if (videoA.src) videoA.currentTime = t;
      if (videoB.src) videoB.currentTime = t;
      seekCurrent.textContent = formatTime(t);
    });

    // Add Video
    const fileInput = document.getElementById('fileInput');
    const addModal = document.getElementById('addModalOverlay');
    document.getElementById('addVideoBtn').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      const f = fileInput.files[0];
      if (!f) return;
      pendingFile = f;
      document.getElementById('mTitle').value = f.name.replace(/\.[^/.]+$/, '');
      document.getElementById('mDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('mTag').value = '';
      addModal.classList.add('show');
      fileInput.value = '';
    });

    document.getElementById('mCancelBtn').addEventListener('click', () => {
      pendingFile = null;
      addModal.classList.remove('show');
    });

    document.getElementById('mSaveBtn').addEventListener('click', async () => {
      if (!pendingFile) return;
      const title = document.getElementById('mTitle').value.trim() || '(無題)';
      const date = document.getElementById('mDate').value || new Date().toISOString().split('T')[0];
      const tag = document.getElementById('mTag').value.trim();

      const id = Date.now() + Math.floor(Math.random() * 1000);
      await idbPutVideo(id, pendingFile);

      const meta = loadMeta();
      meta.unshift({ id, title, date, tag, createdAt: Date.now() });
      saveMeta(meta);

      pendingFile = null;
      addModal.classList.remove('show');
      renderSelectOptions();
      renderLibrary();
    });

    function renderLibrary() {
      const meta = loadMeta();
      const root = document.getElementById('library-root');
      if (!meta.length) {
        root.innerHTML = `<div class="uq-empty-box">まだ保存された動画がありません。「＋ 動画を追加」から動画を登録してください。</div>`;
        return;
      }

      root.innerHTML = meta.map(m => `
        <div class="uq-library-item">
          <div class="uq-lib-info">
            <div class="uq-lib-title">${m.title || '(無題)'}</div>
            <div class="uq-lib-meta">${m.date || '─'}</div>
            ${m.tag ? `<span class="uq-lib-tag">🏷 ${m.tag}</span>` : ''}
          </div>
          <div class="uq-lib-actions">
            <button class="uq-btn primary" onclick="useInSlot(${m.id}, 'A')">Aに設定</button>
            <button class="uq-btn" onclick="useInSlot(${m.id}, 'B')">Bに設定</button>
            <button class="uq-btn danger" onclick="deleteVideo(${m.id})">削除</button>
          </div>
        </div>
      `).join('');
    }

    window.useInSlot = function(id, slot) {
      const sel = slot === 'A' ? selectA : selectB;
      const vid = slot === 'A' ? videoA : videoB;
      sel.value = String(id);
      loadIntoSlot(vid, String(id));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteVideo = async function(id) {
      if (!confirm('この動画をライブラリから削除しますか？')) return;
      await idbDeleteVideo(id);
      const meta = loadMeta().filter(m => m.id !== id);
      saveMeta(meta);
      renderSelectOptions();
      renderLibrary();
    };

    renderSelectOptions();
    renderLibrary();

    function toggleDrawer() {
      const drawer = document.getElementById('sideDrawer');
      const overlay = document.getElementById('drawerOverlay');
      const isOpen = drawer.classList.contains('open');
      if (isOpen) {
        drawer.classList.remove('open');
        overlay.classList.remove('show');
      } else {
        drawer.classList.add('open');
        overlay.classList.add('show');
      }
    }

    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');

    function updateTheme(isDark) {
      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeIcon.textContent = 'light_mode';
        localStorage.setItem('kyudo_dark_mode', '1');
      } else {
        document.documentElement.removeAttribute('data-theme');
        themeIcon.textContent = 'dark_mode';
        localStorage.setItem('kyudo_dark_mode', '0');
      }
    }

    if (localStorage.getItem('kyudo_dark_mode') === '1') {
      updateTheme(true);
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      updateTheme(!isDark);
    });
  </script>
</body>
